<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Miu Music</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">Miu Music</div>
      <nav>
        <a class="nav-item active">Songs</a>
        <a class="nav-item">Albums</a>
        <a class="nav-item">Artists</a>
      </nav>
      <div class="section-label section-row">
        <span>Watched folders</span>
        <button class="icon-btn" id="add-folder" type="button" title="Add a folder" aria-label="Add a folder">+</button>
      </div>
      <ul class="folder-list" id="folder-list"></ul>
      <p class="folder-error" id="folder-error" role="alert" hidden></p>
      <div class="section-label">Device</div>
      <div class="device-card empty" id="device-card" aria-live="polite">
        <svg class="phone" viewBox="0 0 24 40" aria-hidden="true"><rect x="1" y="1" width="22" height="38" rx="4"/><circle cx="12" cy="34" r="2"/></svg>
        <div>
          <p class="device-name">No device connected</p>
          <p class="muted device-detail">Plug in your iPhone with a USB cable</p>
          <div class="storage" hidden>
            <div class="storage-bar"><div class="storage-used"></div></div>
            <p class="muted storage-label"></p>
          </div>
        </div>
      </div>
    </aside>
    <main class="main">
      <div class="notice" id="prereq-notice" role="alert" hidden>
        <p class="notice-title"></p>
        <p class="notice-body"></p>
        <p class="notice-detail muted"></p>
      </div>
      <div class="empty-state" id="empty-state">
        <h1>Add your music</h1>
        <p class="muted">Choose one or more folders to watch, or drop them here. Miu keeps up with new and removed songs.</p>
        <button class="primary" id="empty-add-folder" type="button">Add folder</button>
      </div>
      <section class="song-view" id="song-view" hidden>
        <header class="view-header">
          <h1>Songs</h1>
          <span class="muted" id="library-summary-text"></span>
        </header>
        <div class="song-row song-head" aria-hidden="true">
          <span>Title</span><span>Artist</span><span>Album</span><span class="num">Time</span>
        </div>
        <div class="song-scroll" id="song-scroll" role="list" aria-label="Songs">
          <div class="song-spacer" id="song-spacer"></div>
        </div>
      </section>
      <footer class="status muted" id="app-version"></footer>
    </main>
  </div>
</body>
</html>
