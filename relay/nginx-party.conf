# Miu Party relay: add inside the musicplayer.vietnamcos.com server blocks (http and https).
# The guest page is static in the site's docroot (/var/www/musicplayer/party/); the two PHP files
# live outside it (/var/www/musicplayer-party/).

location = /party/api.php {
    client_max_body_size 4m;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/musicplayer-party/api.php;
    fastcgi_pass unix:/run/php/php8.4-fpm.sock;
}

location = /party/admin.php {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/musicplayer-party/admin.php;
    fastcgi_pass unix:/run/php/php8.4-fpm.sock;
}

location /party/ {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
}
