[package]
name = "miu-music"
version = "0.3.3"
description = "Miu Music - light music player that syncs liked songs to iPhone"
edition = "2021"
default-run = "miu-music"

[lib]
name = "miu_music_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"
cpal = "0.16"
rtrb = "0.3"
rubato = "0.16"
rustfft = "6"
symphonia = { version = "0.5", features = ["all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.22"
log = { version = "0.4", features = ["std"] }
notify = "8"
object = { version = "0.37", default-features = false, features = ["read", "std"] }
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2"
tempfile = "3"
trash = "5"
encoding_rs = "0.8.42"
chardetng = "1.0.0"
unicode-normalization = "0.1.26"
regex = "1.13.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
rss = { version = "2.1.2", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["std", "alloc"] }
ureq = "3.4.2"
quick-xml = "0.41"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
libloading = "0.8"
windows-sys = { version = "0.60", features = ["Win32_System_LibraryLoader", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Devices", "Win32_Devices_PortableDevices", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_System_Com_StructuredStorage", "Win32_System_WinRT", "Foundation", "Media", "Storage_Streams"] }
wasapi = "0.26.0"
# Same version wry uses; only for the WebView2 memory target (windows.rs).
webview2-com = "0.39"

[dev-dependencies]


# Decoding and resampling are far too slow unoptimised; optimise dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 3
