[package]
name = "miu-music"
version = "0.1.0"
description = "Miu Music - light music player that syncs liked songs to iPhone"
edition = "2021"

[lib]
name = "miu_music_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = { version = "0.4", features = ["std"] }
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3"
