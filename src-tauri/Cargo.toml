[package]
name = "miu-music"
version = "0.1.0"
description = "Miu Music - light music player that syncs liked songs to iPhone"
edition = "2021"
default-run = "miu-music"

[lib]
name = "miu_music_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
cpal = "0.16"
rtrb = "0.3"
rubato = "0.16"
symphonia = { version = "0.5", features = ["all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.22"
log = { version = "0.4", features = ["std"] }
notify = "8"
object = { version = "0.37", default-features = false, features = ["read", "std"] }
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2"
tempfile = "3"
trash = "5"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
libloading = "0.8"
windows-sys = { version = "0.60", features = ["Win32_System_LibraryLoader"] }

[dev-dependencies]


# Decoding and resampling are far too slow unoptimised; optimise dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 3
