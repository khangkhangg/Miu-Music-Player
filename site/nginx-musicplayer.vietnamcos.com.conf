# musicplayer.vietnamcos.com — Miu Music landing page (static, from the Miu-Music-Player repo's site/).
# Added 2026-10-20. Cloudflare (orange cloud, Full non-strict) connects on 443, so the 443 block is
# what serves it; the certificate is borrowed from vietnamcos.com like hiring.vietnamcos.com does.
# Without this file the name fell through to the default vhost (bank.duykhang.com).

server {
    listen 80;
    listen [::]:80;
    server_name musicplayer.vietnamcos.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; allow all; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name musicplayer.vietnamcos.com;

    ssl_certificate     /etc/letsencrypt/live/vietnamcos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vietnamcos.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/musicplayer;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location ~ /\. { deny all; access_log off; }

    location = /index.html { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy strict-origin-when-cross-origin always; add_header X-Frame-Options SAMEORIGIN always; }
    location ~* \.(svg|png|ico)$ { expires 7d; add_header X-Content-Type-Options nosniff always; }

    location / { try_files $uri $uri/ =404; }
}
